# Optional two-worker topology for scheduled/manual integration tests.
services:
  namenode:
    environment:
      HDFS_CONF_dfs_replication: "2"

  datanode:
    environment:
      HDFS_CONF_dfs_replication: "2"

  datanode2:
    image: bde2020/hadoop-datanode:${HADOOP_TAG:-2.0.0-hadoop3.2.1-java8}
    restart: unless-stopped
    mem_limit: 500m
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "2"
      SERVICE_PRECONDITION: namenode:9870
    volumes:
      - datanode2_data:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    networks: [hadoop_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9864/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  nodemanager:
    environment:
      YARN_CONF_yarn_nodemanager_resource_memory___mb: "512"
      YARN_CONF_yarn_nodemanager_resource_cpu___vcores: "1"
      YARN_CONF_yarn_nodemanager_vmem___check___enabled: "false"

  nodemanager2:
    image: bde2020/hadoop-nodemanager:${HADOOP_TAG:-2.0.0-hadoop3.2.1-java8}
    restart: unless-stopped
    mem_limit: 700m
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
      YARN_CONF_yarn_nodemanager_aux___services: mapreduce_shuffle
      YARN_CONF_yarn_nodemanager_resource_memory___mb: "512"
      YARN_CONF_yarn_nodemanager_resource_cpu___vcores: "1"
      YARN_CONF_yarn_nodemanager_vmem___check___enabled: "false"
      YARN_CONF_yarn_scheduler_minimum___allocation___mb: "256"
      YARN_CONF_yarn_scheduler_maximum___allocation___mb: "512"
      YARN_CONF_yarn_app_mapreduce_am_resource_mb: "256"
      YARN_CONF_yarn_app_mapreduce_am_command___opts: "-Xmx192m"
      MAPRED_CONF_mapreduce_framework_name: yarn
      SERVICE_PRECONDITION: resourcemanager:8088
    depends_on:
      resourcemanager:
        condition: service_healthy
    networks: [hadoop_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8042/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  spark-worker:
    environment:
      SPARK_WORKER_MEMORY: 512m
      SPARK_DAEMON_MEMORY: 128m
      SPARK_WORKER_CORES: "1"

  spark-worker2:
    image: bde2020/spark-worker:3.0.0-hadoop3.2
    restart: unless-stopped
    mem_limit: 800m
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 512m
      SPARK_DAEMON_MEMORY: 128m
      SPARK_WORKER_CORES: "1"
      PYSPARK_PYTHON: python3
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    depends_on:
      spark-master:
        condition: service_healthy
    networks: [hadoop_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  datanode2_data:
