services:
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    restart: unless-stopped
    mem_limit: 400m
    environment:
      - POSTGRES_DB=metastore
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hive -d metastore || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - hadoop_net

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    restart: unless-stopped
    mem_limit: 1500m
    ports:
      - "10000:10000"
      - "10002:10002"
    entrypoint: [ "/bin/bash", "/entrypoint-custom.sh" ]
    volumes:
      - ./hive/entrypoint.sh:/entrypoint-custom.sh:ro
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
      hive-metastore-postgresql:
        condition: service_healthy
    networks:
      - hadoop_net
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/10000' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
