services:
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    restart: unless-stopped
    mem_limit: 400m
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hive
    # The image init script creates the `metastore` database and Hive schema.
    # Check the schema VERSION table, not just PostgreSQL TCP readiness.
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d metastore -tAc 'SELECT 1 FROM VERSION LIMIT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks: [hadoop_net]

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    restart: unless-stopped
    mem_limit: 1500m
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HIVE_METASTORE_USER: hive
    entrypoint: ["/bin/bash", "/entrypoint-custom.sh"]
    volumes:
      - ./hive/entrypoint.sh:/entrypoint-custom.sh:ro
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
      nodemanager:
        condition: service_healthy
      hive-metastore-postgresql:
        condition: service_healthy
    networks: [hadoop_net]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/10000'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
