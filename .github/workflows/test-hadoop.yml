name: Hadoop ecosystem smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hadoop-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "${{ matrix.profile }} integration test"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            compose_file: docker-compose.yml
          - profile: hive
            compose_file: docker-compose.yml:docker-compose.hive.yml
          - profile: spark
            compose_file: docker-compose.yml:docker-compose.spark.yml
    env:
      COMPOSE_FILE: ${{ matrix.compose_file }}
      MAX_WAIT_SECONDS: "300"
      READY_TIMEOUT: "360"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Show runtime versions
        run: |
          docker --version
          docker compose version
          docker info --format 'Docker server: {{.ServerVersion}}; CPUs: {{.NCPU}}; Memory: {{.MemTotal}}'

      - name: Pull images
        run: docker compose pull

      - name: Start profile
        run: |
          docker compose up -d --wait --wait-timeout 400
          docker compose ps -a

      - name: Run HDFS + YARN + MapReduce test
        run: bash scripts/run-wordcount.sh

      - name: Run Hive SQL integration test
        if: matrix.profile == 'hive'
        run: bash scripts/run-hive-query.sh /test/output

      - name: Run standalone Spark integration test
        if: matrix.profile == 'spark'
        run: bash scripts/run-spark-job.sh

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > artifacts/compose-logs.txt 2>&1 || true
          docker compose config > artifacts/compose-config.yml 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.profile }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down profile
        if: always()
        run: docker compose down -v --remove-orphans
