name: Test Hadoop Ecosystem

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            compose_args: "-f docker-compose.yml"
            runner: core
          - profile: hive
            compose_args: "-f docker-compose.yml -f docker-compose.hive.yml"
            runner: hive
          - profile: spark
            compose_args: "-f docker-compose.yml -f docker-compose.spark.yml"
            runner: spark

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Pull images
        run: docker compose ${{ matrix.compose_args }} pull

      - name: Start cluster (wait for health)
        run: |
          docker compose ${{ matrix.compose_args }} up -d --wait --wait-timeout 300
          docker compose ${{ matrix.compose_args }} ps

      # ---------- core pipeline: HDFS + MapReduce ----------
      - name: Run WordCount (HDFS + MapReduce)
        run: |
          chmod +x scripts/run-wordcount.sh
          ./scripts/run-wordcount.sh

      # ---------- hive pipeline ----------
      - name: Run Hive query
        if: matrix.profile == 'hive'
        run: |
          chmod +x scripts/run-hive-query.sh
          ./scripts/run-hive-query.sh /test/output

      # ---------- spark pipeline ----------
      - name: Run Spark job
        if: matrix.profile == 'spark'
        run: |
          chmod +x scripts/run-spark-job.sh
          ./scripts/run-spark-job.sh

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose ${{ matrix.compose_args }} ps
          docker compose ${{ matrix.compose_args }} logs --no-color --tail=200

      - name: Stop cluster
        if: always()
        run: docker compose ${{ matrix.compose_args }} down -v
