name: Test Hadoop Cluster

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-hadoop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Start Hadoop Cluster (wait for health)
        run: |
          docker compose up -d --wait --wait-timeout 300
          docker compose ps

      - name: Run WordCount pipeline
        run: |
          chmod +x scripts/run-wordcount.sh
          ./scripts/run-wordcount.sh

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "===== docker compose ps ====="
          docker compose ps
          echo "===== docker compose logs ====="
          docker compose logs --no-color --tail=200

      - name: Stop Hadoop Cluster
        if: always()
        run: docker compose down -v
