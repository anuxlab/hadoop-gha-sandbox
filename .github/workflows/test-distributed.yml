name: Distributed Hadoop proof of concept

on:
  pull_request:
    branches: [main]
    paths:
      - '.env'
      - 'docker-compose*.yml'
      - 'hive/**'
      - 'jobs/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.env'
      - 'docker-compose*.yml'
      - 'hive/**'
      - 'jobs/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

  # Nightly is intentionally DISABLED for now. To enable a daily run later,
  # uncomment this schedule block. GitHub schedule times are in UTC.
  # schedule:
  #   - cron: '37 2 * * *'  # 08:07 Asia/Kolkata

permissions:
  contents: read

concurrency:
  group: hadoop-distributed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distributed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.spark.yml:docker-compose.distributed.yml
      MAX_WAIT_SECONDS: "240"
      EXPECTED_DATANODES: "2"
      EXPECTED_NODEMANAGERS: "2"
      EXPECTED_SPARK_WORKERS: "2"
      EXPECTED_REPLICATION: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test readiness and regression checks
        run: bash scripts/test-readiness-parsers.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Record runner resources
        run: |
          docker --version
          docker compose version
          docker info --format 'Docker server: {{.ServerVersion}}; CPUs: {{.NCPU}}; memory bytes: {{.MemTotal}}'

      - name: Pull images
        run: docker compose pull

      - name: Start multi-worker topology
        run: |
          docker compose up -d --wait --wait-timeout 450
          docker compose ps -a

      - name: Verify HDFS replication and MapReduce on YARN
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          bash scripts/run-wordcount.sh 2>&1 | tee artifacts/run-wordcount.log

      - name: Verify Spark worker participation and cross-engine results
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          bash scripts/run-spark-job.sh 2>&1 | tee artifacts/run-spark-job.log

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > artifacts/compose-logs.txt 2>&1 || true
          docker compose config > artifacts/compose-config.yml 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-distributed-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
