name: Scalable HDFS and compute integration test

# This bounded workload runs automatically for relevant changes and daily.
# The dispatch inputs remain optional overrides; CI and schedule events use safe defaults.
on:
  pull_request:
    branches: [main]
    paths:
      - '.env'
      - 'docker-compose*.yml'
      - 'hive/**'
      - 'jobs/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.env'
      - 'docker-compose*.yml'
      - 'hive/**'
      - 'jobs/**'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    - cron: '47 2 * * *' # Daily bounded scale regression (02:47 UTC).
  workflow_dispatch:
    inputs:
      files:
        description: Number of input files (2-128)
        type: number
        required: true
        default: 24
      lines_per_file:
        description: Lines per file (600-2000); each file crosses the 16 KiB block boundary
        type: number
        required: true
        default: 800
      reducers:
        description: Number of MapReduce reducers (1-4)
        type: number
        required: true
        default: 2

permissions:
  contents: read

concurrency:
  group: hadoop-scale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SCALE_FILES: ${{ github.event.inputs.files || '24' }}
      SCALE_LINES_PER_FILE: ${{ github.event.inputs.lines_per_file || '800' }}
      SCALE_REDUCERS: ${{ github.event.inputs.reducers || '2' }}
      MAX_WAIT_SECONDS: "240"
      READY_TIMEOUT: "360"
      STARTUP_TIMEOUT: "450"
      PULL_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static and regression checks
        run: bash scripts/test-readiness-parsers.sh

      - name: Show runner and Docker resources
        run: |
          docker --version
          docker compose version
          docker info --format 'Docker server: {{.ServerVersion}}; CPUs: {{.NCPU}}; memory bytes: {{.MemTotal}}'

      - name: Run scale profile
        run: bash scripts/run-profile.sh scale

      - name: Upload scale diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-scale-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
