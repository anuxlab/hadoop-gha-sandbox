name: Full-stack integration test

on:
  pull_request:
    branches: [main]
    paths:
      - '.env'
      - 'docker-compose*.yml'
      - 'hive/**'
      - 'jobs/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.env'
      - 'docker-compose*.yml'
      - 'hive/**'
      - 'jobs/**'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    - cron: '27 2 * * *' # Daily full-stack regression (02:27 UTC).
  workflow_dispatch: # Optional rerun; not required for automation.

permissions:
  contents: read

concurrency:
  group: hadoop-full-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.hive.yml:docker-compose.spark.yml
      MAX_WAIT_SECONDS: "180"
      READY_TIMEOUT: "360"
      EXPECTED_DATANODES: "1"
      EXPECTED_NODEMANAGERS: "1"
      EXPECTED_SPARK_WORKERS: "1"
      EXPECTED_REPLICATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test readiness and regression checks
        run: bash scripts/test-readiness-parsers.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Record runner resources
        run: |
          docker --version
          docker compose version
          docker info --format 'Docker server: {{.ServerVersion}}; CPUs: {{.NCPU}}; memory bytes: {{.MemTotal}}'

      - name: Pull images
        run: docker compose pull

      - name: Start all services
        run: |
          docker compose up -d --wait --wait-timeout 450
          docker compose ps -a

      - name: Run MapReduce on YARN
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          bash scripts/run-wordcount.sh 2>&1 | tee artifacts/run-wordcount.log

      - name: Run Hive SQL integration test
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          bash scripts/run-hive-query.sh /test/output 2>&1 | tee artifacts/run-hive-query.log

      - name: Run Spark and cross-engine comparison
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          bash scripts/run-spark-job.sh 2>&1 | tee artifacts/run-spark-job.log

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > artifacts/compose-logs.txt 2>&1 || true
          docker compose config > artifacts/compose-config.yml 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
