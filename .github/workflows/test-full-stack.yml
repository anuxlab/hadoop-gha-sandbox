name: Test Full Stack (manual)

on:
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    continue-on-error: true   # don't fail the repo if memory is tight
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull all images
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.hive.yml \
            -f docker-compose.spark.yml pull

      - name: Start everything
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.hive.yml \
            -f docker-compose.spark.yml \
            up -d --wait --wait-timeout 400

      - name: Run MapReduce
        run: |
          chmod +x scripts/run-wordcount.sh
          ./scripts/run-wordcount.sh

      - name: Run Hive
        run: |
          chmod +x scripts/run-hive-query.sh
          ./scripts/run-hive-query.sh /test/output

      - name: Run Spark
        run: |
          chmod +x scripts/run-spark-job.sh
          ./scripts/run-spark-job.sh

      - name: Dump logs
        if: always()
        run: docker compose logs --no-color --tail=100

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.hive.yml \
            -f docker-compose.spark.yml \
            down -v
